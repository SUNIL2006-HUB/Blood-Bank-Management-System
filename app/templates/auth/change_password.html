{% extends "base.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
<section aria-labelledby="password-heading">
    <h1 id="password-heading">Change your password</h1>
    <p>You must choose a new password before continuing.</p>
    {% for error in errors %}
        <p class="field-error" role="alert">{{ error }}</p>
    {% endfor %}
    <form method="post">
        <label for="password">New password</label>
        <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        >
        <label for="confirmation">Confirm new password</label>
        <input
            id="confirmation"
            name="confirmation"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        >
        <button type="submit">Change password</button>
    </form>
</section>
{% endblock %}
