{% extends "base.html" %}

{% block title %}Set up management{% endblock %}

{% block content %}
<section aria-labelledby="setup-heading">
    <h1 id="setup-heading">Set up the first management account</h1>
    <p>This page is available only until the first management account is created.</p>
    <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" maxlength="80" autocomplete="username" required>

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
        >
        <p class="hint">Use at least 8 characters.</p>
        <button type="submit">Create management account</button>
    </form>
</section>
{% endblock %}
